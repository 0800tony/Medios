services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: oliva
      POSTGRES_USER: oliva
      POSTGRES_PASSWORD: oliva
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oliva"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./apps/backend
    env_file: .env
    ports: ["8000:8000"]
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./apps/frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports: ["3000:3000"]
    depends_on: [backend]

volumes:
  postgres_data:
  uploads:
